# verify="full" preserved for file-copy, downgraded to "metadata" for bitmap
# (design D5: bitmap incremental NBD exports contain only dirty blocks)
# Test: test_facade_verify_full_preserved_for_filecopy_downgraded_for_bitmap

[[vm]]
name = "vm_fc_full"
base_image = "/var/lib/libvirt/images/vm_fc_full.qcow2"
snapshot_dir = "/var/lib/libvirt/snapshots/vm_fc_full"

  [[vm.target]]
  path = "/mnt/backup/vm_fc_full"
  incremental = true
  incremental_mode = "file-copy"
  verify = "full"

[[vm]]
name = "vm_bitmap_full"
base_image = "/var/lib/libvirt/images/vm_bitmap_full.qcow2"
snapshot_dir = "/var/lib/libvirt/snapshots/vm_bitmap_full"

  [[vm.target]]
  path = "/mnt/backup/vm_bitmap_full"
  incremental = true
  incremental_mode = "bitmap"
  verify = "full"
