# Config fixture testing convert_parallel and convert_out_of_order fields
# with inheritance cascade.
#
# Global defaults: convert_parallel = 2, convert_out_of_order = false.
# - vm_inherit:  inherits both from global — 2, false.
# - vm_override: one target overrides with convert_parallel=8,
#   convert_out_of_order=true; another target inherits both from global.

convert_parallel = 2
convert_out_of_order = false

[[vm]]
name = "vm_inherit"
snapshot_dir = "/var/lib/libvirt/snapshots/vm_inherit"

  [[vm.disk]]
  target = "vda"
  base_image = "/var/lib/libvirt/images/vm_inherit.qcow2"

  [[vm.target]]
  path = "/mnt/backup/vm_inherit"
  incremental = true

[[vm]]
name = "vm_override"
snapshot_dir = "/var/lib/libvirt/snapshots/vm_override"

  [[vm.disk]]
  target = "vda"
  base_image = "/var/lib/libvirt/images/vm_override.qcow2"

  [[vm.target]]
  path = "/mnt/backup/vm_override_convert"
  convert_parallel = 8
  convert_out_of_order = true

  [[vm.target]]
  path = "/mnt/backup/vm_override_inherit"
  # Inherits convert_parallel=2, convert_out_of_order=false from global.
