# full_backup config — tests compress parsing with count-based retention

state_dir = "/var/lib/qsnap/state"

snapshot_chain_length = 168
target_chain_length = 100
target_keep_generations = 2

[[vm]]
name = "vm_with_full"
base_image = "/var/lib/libvirt/images/vm_with_full.qcow2"
snapshot_dir = "/var/lib/libvirt/snapshots/vm_with_full"

  [[vm.target]]
  path = "/mnt/backup/vm_with_full"
  incremental = true
  verify = "compare"
  full_verify_after_create = "compare"
  compress = true

[[vm]]
name = "vm_no_full"
base_image = "/var/lib/libvirt/images/vm_no_full.qcow2"
snapshot_dir = "/var/lib/libvirt/snapshots/vm_no_full"

  [[vm.target]]
  path = "/mnt/backup/vm_no_full"
  incremental = true
  # compress uses the default (true)
