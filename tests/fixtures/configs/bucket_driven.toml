# bucket_driven config — tests count-based FULL backup model
# Uses compress; no deprecated full_every/full_compress.

state_dir = "/var/lib/qsnap/state"
compress = true

snapshot_chain_length = 168
target_chain_length = 100
target_keep_generations = 2

[[vm]]
name = "vm_bucket"
base_image = "/var/lib/libvirt/images/vm_bucket.qcow2"
snapshot_dir = "/var/lib/libvirt/snapshots/vm_bucket"

  [[vm.target]]
  path = "/mnt/backup/vm_bucket"
  incremental = true
  verify = "metadata"
  compress = true

[[vm]]
name = "vm_no_compress"
base_image = "/var/lib/libvirt/images/vm_no_compress.qcow2"
snapshot_dir = "/var/lib/libvirt/snapshots/vm_no_compress"

  [[vm.target]]
  path = "/mnt/backup/vm_no_compress"
  incremental = true
  compress = false
