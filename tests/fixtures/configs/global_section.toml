# Config using [global] section format
[global]
compress = false
lockfile = "/run/qsnap.lock"

[[vm]]
name = "testvm"
snapshot_dir = "/var/lib/libvirt/snapshots/testvm"

  [[vm.disk]]
  target = "vda"
  base_image = "/var/lib/libvirt/images/testvm.qcow2"

  [[vm.target]]
  path = "/mnt/backup/testvm"
