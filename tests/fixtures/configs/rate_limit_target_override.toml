# rate_limit_target_override — global "100M", target overrides with "500K"

rate_limit = "100M"

[[vm]]
name = "testvm"
base_image = "/var/lib/libvirt/images/testvm.qcow2"
snapshot_dir = "/var/lib/libvirt/snapshots/testvm"

  [[vm.target]]
  path = "/mnt/backup/testvm"
  incremental = true
  rate_limit = "500K"
