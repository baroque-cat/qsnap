# bitmap mode with verify="hash" → warning + auto-downgrade to "metadata"
# Test: test_facade_bitmap_mode_hash_warns_and_downgrades

[[vm]]
name = "vm_bitmap_hash"
base_image = "/var/lib/libvirt/images/vm_bitmap_hash.qcow2"
snapshot_dir = "/var/lib/libvirt/snapshots/vm_bitmap_hash"

  [[vm.target]]
  path = "/mnt/backup/vm_bitmap_hash"
  incremental = true
  incremental_mode = "bitmap"
  verify = "hash"
