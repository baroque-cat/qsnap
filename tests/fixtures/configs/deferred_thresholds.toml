# deferred_thresholds — overrides deferred_warn_count and deferred_crit_age

deferred_warn_count = "3"
deferred_crit_age = "30d"

[[vm]]
name = "testvm"
snapshot_dir = "/var/lib/libvirt/snapshots/testvm"

  [[vm.disk]]
  target = "vda"
  base_image = "/var/lib/libvirt/images/testvm.qcow2"

  [[vm.target]]
  path = "/mnt/backup/testvm"
  incremental = true
