# Config with all global fields set
timestamp_format = "short"
preserve_day_of_week = "wednesday"
state_dir = "/tmp/qsnap-state"
lockfile = "/var/lock/qsnap.lock"
snapshot_preserve = "24h 7d 4w 12m 1y"
target_preserve = "48h 14d 8w 12m 1y"

[[vm]]
name = "testvm"
base_image = "/var/lib/libvirt/images/testvm.qcow2"
snapshot_dir = "/var/lib/libvirt/snapshots/testvm"

  [[vm.target]]
  path = "/mnt/backup/testvm"
