[project]
name = "qsnap"
version = "0.1.0"
description = "QEMU/KVM snapshot and backup orchestration for qcow2 images"
authors = [
    {name = "Baroque Cat",email = "baroque-cat@proton.me"}
]
readme = "README.md"
requires-python = "<4.0,>=3.11"
dependencies = []

[project.scripts]
qsnap = "qsnap.cli.app:main"

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# ── pytest ──────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 60
addopts = ["--strict-markers", "--strict-config", "-vv"]
markers = [
    "unit:         fast, isolated, no I/O (deselect with '-m \"not unit\"')",
    "mock:         verify mock implementations satisfy ABC contracts",
    "contract:     every concrete ABC implementation passes shared contract",
    "integration:  requires libvirt daemon and disposable test VM",
    "stress:       long chains, concurrent access, disk-full scenarios",
    "e2e:          full pipeline from config file to restored VM",
]

# ── dev dependencies ────────────────────────────────────────────────────

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-timeout (>=2.4.0,<3.0.0)",
    "pytest-random-order (>=1.1.0,<2.0.0)",
    "ruff (>=0.15.0,<0.16.0)",
    "black (>=26.1.0,<27.0.0)",
    "pyright (>=1.1.411,<2.0.0)",
]

# ── ruff ────────────────────────────────────────────────────────────────

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort (import ordering)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "YTT",    # flake8-2020
]
ignore = [
    "E501",   # line too long (handled by formatter)
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["qsnap"]

# ── pyright ─────────────────────────────────────────────────────────────

[tool.pyright]
include = ["qsnap", "tests"]
exclude = [".venv", "build", "dist", ".git"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

# ── black ───────────────────────────────────────────────────────────────

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\\.pyi?$'
